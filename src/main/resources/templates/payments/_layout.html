<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  Shared head and navigation for the payments console.
  Pages pull these in with th:replace, so the styling and the nav stay in one place.
-->
<head th:fragment="head (pageTitle)">
    <title th:text="'Bankster — ' + ${pageTitle}">Bankster</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <style>
        body { font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif;
               margin: 1.5rem; max-width: 1200px; line-height: 1.45; color: #1a1a1a; }
        h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
        h2 { font-size: 1.15rem; margin-top: 2rem; border-bottom: 1px solid #ddd;
             padding-bottom: 0.25rem; }
        h3 { font-size: 1rem; margin-top: 1.5rem; }
        nav { margin: 0 0 1.5rem 0; padding-bottom: 0.5rem; border-bottom: 2px solid #1a1a1a; }
        nav a { margin-right: 1rem; text-decoration: none; color: #0b5; font-weight: 600; }
        nav a:hover { text-decoration: underline; }
        table { border-collapse: collapse; width: 100%; margin: 0.75rem 0; font-size: 0.875rem; }
        th, td { border: 1px solid #ddd; padding: 0.35rem 0.5rem; text-align: left;
                 vertical-align: top; }
        th { background: #f4f4f4; font-weight: 600; }
        tr:nth-child(even) td { background: #fafafa; }
        .num { text-align: right; font-variant-numeric: tabular-nums; }
        .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.8rem; }
        .muted { color: #666; }
        .tiles { display: flex; flex-wrap: wrap; gap: 0.75rem; margin: 1rem 0; }
        .tile { border: 1px solid #ddd; border-radius: 4px; padding: 0.6rem 0.9rem;
                min-width: 9rem; }
        .tile .label { font-size: 0.75rem; color: #666; text-transform: uppercase;
                       letter-spacing: 0.03em; }
        .tile .value { font-size: 1.25rem; font-weight: 600; font-variant-numeric: tabular-nums; }
        .ok { color: #0a7d2e; font-weight: 600; }
        .warn { color: #b35c00; font-weight: 600; }
        .bad { color: #b00020; font-weight: 600; }
        .narrative li { margin-bottom: 0.6rem; }
        pre { background: #f7f7f7; border: 1px solid #ddd; padding: 0.75rem;
              overflow-x: auto; font-size: 0.75rem; line-height: 1.35; }
        form.inline { display: inline; }
        button { font-size: 0.8rem; padding: 0.2rem 0.55rem; cursor: pointer; }
        caption { text-align: left; font-size: 0.8rem; color: #666; padding-bottom: 0.3rem; }
    </style>
</head>

<body>
<nav th:fragment="nav">
    <a href="/payments">Overview</a>
    <a href="/payments/cards">Card payments</a>
    <a href="/payments/rails">Banking rails</a>
    <a href="/payments/ledger">Ledger</a>
    <a href="/payments/settlement">Settlement &amp; recon</a>
    <a href="/payments/compliance">Compliance</a>
    <a href="/payments/events">Events</a>
    <a href="/payments/messages">ISO 20022</a>
    <a href="/psd2" class="muted">Open banking</a>
</nav>
</body>
</html>
