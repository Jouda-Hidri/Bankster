server.port=8099

# --- Berlin Group NextGenPSD2 (XS2A) -------------------------------------
# Defaults target the LHV NextGenPSD2 sandbox. Run scripts/generate-sandbox-cert.sh
# once to create the transport certificate the ASPSP authenticates the TPP with.
psd2.base-url=https://api.sandbox.lhv.eu/psd2
# Left blank the TPP id is read from the certificate subject (OID 2.5.4.97).
psd2.client-id=
psd2.redirect-uri=http://localhost:8099/psd2/callback/oauth
psd2.consent-redirect-uri=http://localhost:8099/psd2/callback/consent
psd2.keystore=file:./psd2-sandbox/tpp-keystore.p12
psd2.keystore-password=changeit
psd2.psu-ip-address=127.0.0.1
psd2.transaction-history-days=90
psd2.consent-validity-days=90
psd2.frequency-per-day=50

# --- Payments and banking modules ----------------------------------------
# The acquirer's measured fraud rate in basis points. Sets the ceiling the
# transaction-risk-analysis SCA exemption may be claimed up to.
payments.acquirer-fraud-rate-basis-points=5
# This institution's own per-transaction SEPA Instant limit. The EPC removed the
# scheme-level 100k ceiling in October 2025; institutions still set their own.
payments.instant-transfer-limit=100000.00
# Above this, an urgent transfer is routed to RTGS rather than the retail rail.
payments.high-value-threshold=250000.00
payments.demo-currency=EUR
# Populates the console with a full lifecycle at start-up.
payments.seed-demo-data=true
