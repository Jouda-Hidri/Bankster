# Test overrides. Everything not named here falls through to the main
# application.properties.

# Point the PSD2 client at the throwaway keystore the build generates, rather than the
# sandbox certificate from scripts/generate-sandbox-cert.sh. Psd2Config refuses to start
# without a keystore and PaymentsWiringTest boots the whole context, so this is what lets
# the suite run on a fresh clone and in CI. See the generateTestKeystore task.
psd2.keystore=file:./build/test-certificates/psd2-test-keystore.p12
psd2.keystore-password=changeit

# The sandbox is never contacted from a test — every PSD2 test either stubs the ASPSP over
# loopback or excludes Psd2Config entirely — so this is a deliberately unroutable address
# rather than a real host.
psd2.base-url=https://psd2.invalid

# The demo scenario is driven explicitly by PaymentsWiringTest, so it must not also run at
# context start-up: that would double the history every test class that boots the context.
payments.seed-demo-data=false
