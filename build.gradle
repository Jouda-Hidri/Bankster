plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'io.freefair.lombok' version '8.10.2'
}

group = 'bankster'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
}

/*
 * ND4J ships its compute backend as a platform-specific native library, selected by
 * classifier. These were pinned to macosx-arm64, which meant the stock-forecasting tests
 * failed with UnsatisfiedLinkError on anything else — including CI.
 *
 * Resolving the classifier from the host rather than hard-coding one keeps the build
 * working on Apple Silicon and on Linux CI while downloading natives for one platform
 * only: the full set across platforms is several hundred megabytes.
 */
def nd4jNativeClassifier = {
    def os = System.getProperty('os.name').toLowerCase()
    def arch = System.getProperty('os.arch').toLowerCase()
    def arm = arch.contains('aarch64') || arch.contains('arm64')
    if (os.contains('mac')) {
        return arm ? 'macosx-arm64' : 'macosx-x86_64'
    }
    if (os.contains('linux')) {
        return arm ? 'linux-arm64' : 'linux-x86_64'
    }
    if (os.contains('windows')) {
        return 'windows-x86_64'
    }
    return null
}()

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // DL4J / ND4J
    implementation 'org.deeplearning4j:deeplearning4j-core:1.0.0-M2.1'

    // Other deps
    implementation 'org.json:json:20240303'

    implementation("org.nd4j:nd4j-native:1.0.0-M2.1")
    if (nd4jNativeClassifier != null) {
        implementation("org.nd4j:nd4j-native:1.0.0-M2.1:${nd4jNativeClassifier}")
        implementation("org.bytedeco:openblas:0.3.21-1.5.8:${nd4jNativeClassifier}")
    } else {
        logger.warn("Unrecognised platform; ND4J will have no native backend and the "
                + "stock-forecasting tests will fail.")
    }

    // Netty's native DNS resolver, which only exists for macOS. Without the guard it is
    // an unresolvable dependency everywhere else.
    if (nd4jNativeClassifier?.startsWith('macosx')) {
        def nettyClassifier = nd4jNativeClassifier == 'macosx-arm64' ? 'osx-aarch_64' : 'osx-x86_64'
        implementation "io.netty:netty-resolver-dns-native-macos:4.1.112.Final:${nettyClassifier}"
    }

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

/*
 * A throwaway TPP certificate for the tests.
 *
 * Psd2Config refuses to start without a keystore, and PaymentsWiringTest boots the whole
 * application context — so without this the suite fails on a fresh clone and in CI, even
 * though the payments modules have nothing to do with PSD2. Generating it here rather
 * than committing one keeps anything certificate-shaped out of the repository, and means
 * `./gradlew test` simply works with no setup step to forget.
 *
 * It is self-signed, offline, password 'changeit', and trusted by nothing. The subject
 * carries an organizationIdentifier (OID 2.5.4.97) because that is what the TPP id is
 * read out of. The real sandbox certificate from scripts/generate-sandbox-cert.sh is
 * unaffected and still used at runtime.
 */
def testKeystore = layout.buildDirectory.file('test-certificates/psd2-test-keystore.p12')

tasks.register('generateTestKeystore') {
    description = 'Generates a self-signed TPP keystore so the test suite can boot the context.'
    outputs.file(testKeystore)
    outputs.upToDateWhen { testKeystore.get().asFile.exists() }

    doLast {
        def target = testKeystore.get().asFile
        target.parentFile.mkdirs()
        if (target.exists()) {
            return
        }
        def keytool = "${System.getProperty('java.home')}/bin/keytool"
        providers.exec {
            commandLine keytool,
                    '-genkeypair', '-alias', 'tpp',
                    '-keyalg', 'RSA', '-keysize', '2048', '-validity', '3650',
                    '-storetype', 'PKCS12',
                    '-keystore', target.absolutePath,
                    '-storepass', 'changeit', '-keypass', 'changeit',
                    '-dname', 'OID.2.5.4.97=PSDEE-TEST-000000, CN=Bankster Test TPP, O=Bankster, C=EE'
        }.result.get()
        logger.lifecycle("Generated a test TPP keystore at ${target}")
    }
}

tasks.named('test') {
    dependsOn 'generateTestKeystore'
}

// ND4J/JavaCPP reflect into JDK internals; JDK 17+ requires these to be opened explicitly.
def nd4jJvmArgs = [
        '--add-opens=java.base/java.nio=ALL-UNNAMED',
        '--add-opens=java.base/java.lang=ALL-UNNAMED',
        '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED'
]

tasks.named('bootRun') {
    jvmArgs += nd4jJvmArgs
}

tasks.named('test') {
    jvmArgs += nd4jJvmArgs
}
