plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'io.freefair.lombok' version '8.10.2'
}

group = 'bankster'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // DL4J / ND4J
    implementation 'org.deeplearning4j:deeplearning4j-core:1.0.0-M2.1'

    // Other deps
    implementation 'org.json:json:20240303'
    implementation 'io.netty:netty-resolver-dns-native-macos:4.1.112.Final:osx-aarch_64' // for Apple Silicon

    implementation("org.nd4j:nd4j-native:1.0.0-M2.1")
    // For M1 apple processor
    implementation("org.nd4j:nd4j-native:1.0.0-M2.1:macosx-arm64")
    implementation("org.bytedeco:openblas:0.3.21-1.5.8:macosx-arm64")

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

/*
 * A throwaway TPP certificate for the tests.
 *
 * Psd2Config refuses to start without a keystore, and PaymentsWiringTest boots the whole
 * application context — so without this the suite fails on a fresh clone and in CI, even
 * though the payments modules have nothing to do with PSD2. Generating it here rather
 * than committing one keeps anything certificate-shaped out of the repository, and means
 * `./gradlew test` simply works with no setup step to forget.
 *
 * It is self-signed, offline, password 'changeit', and trusted by nothing. The subject
 * carries an organizationIdentifier (OID 2.5.4.97) because that is what the TPP id is
 * read out of. The real sandbox certificate from scripts/generate-sandbox-cert.sh is
 * unaffected and still used at runtime.
 */
def testKeystore = layout.buildDirectory.file('test-certificates/psd2-test-keystore.p12')

tasks.register('generateTestKeystore') {
    description = 'Generates a self-signed TPP keystore so the test suite can boot the context.'
    outputs.file(testKeystore)
    outputs.upToDateWhen { testKeystore.get().asFile.exists() }

    doLast {
        def target = testKeystore.get().asFile
        target.parentFile.mkdirs()
        if (target.exists()) {
            return
        }
        def keytool = "${System.getProperty('java.home')}/bin/keytool"
        providers.exec {
            commandLine keytool,
                    '-genkeypair', '-alias', 'tpp',
                    '-keyalg', 'RSA', '-keysize', '2048', '-validity', '3650',
                    '-storetype', 'PKCS12',
                    '-keystore', target.absolutePath,
                    '-storepass', 'changeit', '-keypass', 'changeit',
                    '-dname', 'OID.2.5.4.97=PSDEE-TEST-000000, CN=Bankster Test TPP, O=Bankster, C=EE'
        }.result.get()
        logger.lifecycle("Generated a test TPP keystore at ${target}")
    }
}

tasks.named('test') {
    dependsOn 'generateTestKeystore'
}

// ND4J/JavaCPP reflect into JDK internals; JDK 17+ requires these to be opened explicitly.
def nd4jJvmArgs = [
        '--add-opens=java.base/java.nio=ALL-UNNAMED',
        '--add-opens=java.base/java.lang=ALL-UNNAMED',
        '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED'
]

tasks.named('bootRun') {
    jvmArgs += nd4jJvmArgs
}

tasks.named('test') {
    jvmArgs += nd4jJvmArgs
}
